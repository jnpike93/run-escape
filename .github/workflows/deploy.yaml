name: Deploy Run Escape

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Deployment Secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Verifying deployment configuration..."
          ERRORS=0
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::Missing GitHub Actions Secret: SERVER_HOST."
            ERRORS=1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "::error::Missing GitHub Actions Secret: SERVER_USER."
            ERRORS=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing GitHub Actions Secret: SSH_PRIVATE_KEY."
            ERRORS=1
          fi
          if [ "$ERRORS" -eq 1 ]; then
            exit 1
          fi
          echo "All deployment secrets configured."

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 2323 }}
          script: |
            set -euo pipefail

            echo "=== 1. Syncing Run Escape Repository ==="
            if [ -d "/opt/run-escape/.git" ]; then
              cd /opt/run-escape
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            else
              git clone https://github.com/jnpike93/run-escape.git /opt/run-escape
              cd /opt/run-escape
            fi
            git remote get-url upstream > /dev/null 2>&1 && git remote set-url upstream https://github.com/Dynrothe/Run-Escape.git || git remote add upstream https://github.com/Dynrothe/Run-Escape.git
            npm install --no-audit --no-fund --ignore-scripts
            node /opt/run-escape/scripts/auto_sync_upstream.cjs

            echo "=== 2. Configuring Hourly Upstream Auto-Sync Cron Job ==="
            printf 'SHELL=/bin/bash\nPATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n0 * * * * root cd /opt/run-escape && node /opt/run-escape/scripts/auto_sync_upstream.cjs >> /var/log/run-escape-sync.log 2>&1\n' > /etc/cron.d/run-escape-upstream-sync
            chmod 644 /etc/cron.d/run-escape-upstream-sync

            echo "=== 3. Starting / Restarting Run Escape with PM2 (Loopback Bind) ==="
            pm2 delete run-escape > /dev/null 2>&1 || true
            pm2 start server/ecosystem.config.cjs --update-env
            pm2 save

            echo "=== 4. Configuring Nginx and Preserving TLS ==="
            CERT_DIR="/etc/letsencrypt/live/run-escape.cuteanimegirls.moe"
            if [ -f "$CERT_DIR/fullchain.pem" ] && [ -f "$CERT_DIR/privkey.pem" ]; then
              cp /opt/run-escape/server/nginx.conf /etc/nginx/sites-available/run-escape
              ln -sf /etc/nginx/sites-available/run-escape /etc/nginx/sites-enabled/run-escape
              certbot --nginx -d run-escape.cuteanimegirls.moe --non-interactive --agree-tos --email jakepike2011@gmail.com --redirect --keep-until-expiring
              nginx -t && systemctl reload nginx
            else
              cp /opt/run-escape/server/nginx.conf /etc/nginx/sites-available/run-escape
              ln -sf /etc/nginx/sites-available/run-escape /etc/nginx/sites-enabled/run-escape
              nginx -t && systemctl reload nginx
              certbot --nginx -d run-escape.cuteanimegirls.moe --non-interactive --agree-tos --email jakepike2011@gmail.com --redirect --keep-until-expiring
            fi

            echo "=== 5. Verifying TLS Listener and Loopback Backend ==="
            ss -tlnp | grep -q ':443 '
            echo "=== Deployment Succeeded! ==="
