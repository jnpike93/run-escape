limit_req_zone $binary_remote_addr zone=run_escape_limit:10m rate=30r/s;

server {
    server_name run-escape.cuteanimegirls.moe;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/wasm font/ttf image/svg+xml;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Block access to hidden files and directories (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to backend source, configuration, source maps, and operational directories
    location ~* ^/(server(/|$)|serve\.py|nginx\.conf|ecosystem\.config\.(js|cjs)|scratch(/|$)|.*\.(map|log|pyc|sh|cjs)$) {
        deny all;
        return 404;
    }

    # Serve cache files: only allow specific extensions
    location ~* ^/caches/.*\.(bin|dat2?|idx\d*|xtea|json|gz)$ {
        root /opt/run-escape;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "https://run-escape.cuteanimegirls.moe" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        limit_req zone=run_escape_limit burst=60 nodelay;
    }
    location /caches/ {
        return 404;
    }

    location ~* ^/assets/.*\.(js|css|json|wasm|ogg|png|ico|ttf|woff2?)$ {
        root /opt/run-escape;
        sendfile on;
        tcp_nopush on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "https://run-escape.cuteanimegirls.moe" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        limit_req zone=run_escape_limit burst=60 nodelay;
    }

    # WebSocket relay - enforce upgrade requirement
    location /ws {
        limit_req zone=run_escape_limit burst=30 nodelay;
        if ($http_upgrade != "websocket") {
            return 426;
        }
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=run_escape_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Access-Control-Allow-Origin "https://run-escape.cuteanimegirls.moe" always;
    }

    listen 80;
    listen [::]:80;
}
